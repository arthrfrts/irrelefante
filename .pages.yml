media:
  - name: media
    label: Images and Video
    input: uploads
    output: /uploads
    rename: safe
    categories:
      - image
      - video
      - audio
    commit:
      templates:
        create: "media: add {filename}"
        update: "media: update {filename}"
        delete: "media: remove {filename}"
        rename: "media: rename {oldFilename} -> {newFilename}"
  - name: docs
    label: Documents
    input: uploads/docs
    output: /uploads/docs
    rename: safe
    categories:
      - document
      - spreadsheet
      - code
    commit:
      templates:
        create: "docs: add {filename}"
        update: "docs: update {filename}"
        delete: "docs: remove {filename}"
        rename: "docs: rename {oldFilename} -> {newFilename}"

components:
  syndicate_to:
    type: select
    label: Syndicate to
    options:
      multiple: true
      placeholder: Choose where to syndicate this post
      values:
        - name: bluesky
          label: Bluesky
        - name: mastodon
          label: Mastodon
        - name: flickr
          label: Flickr
    default:
      - bluesky
      - mastodon
  image:
    type: object
    label: Image
    fields:
      - name: path
        label: Image
        type: image
        options:
          media: media
          categories:
            - image
      - name: alt
        label: Alt text
        type: string
      - name: caption
        label: Caption
        type: string
  review:
    type: object
    label: Review
    fields:
      - name: item
        label: Item
        type: string
      - name: format
        label: Format
        type: select
        options:
          values:
            - name: Disco
              label: Disco
            - name: Filme
              label: Filme
            - name: Jogo
              label: Jogo
            - name: Livro
              label: Livro
            - name: Série
              label: Série
      - name: summary
        label: Summary
        type: string
      - name: poster
        label: Poster
        type: image
        options:
          media: media
          categories:
            - image
      - name: rating
        label: Rating
        type: number
        options:
          min: 0
          max: 5
          step: 0.5
  layout:
    type: string
    default: post
    hidden: true
  title:
    type: string
    label: Title
  body:
    type: rich-text
    label: Body
    options:
      format: markdown
      media: media
  date:
    type: date
    label: Date
    options:
      time: true
      format: yyyy-MM-dd' 'HH:mm' -0300'
  tags:
    type: string
    label: Tags
    list: true
  canonical_url:
    type: string
    label: Canonical URL
  syndication:
    type: string
    label: Syndication
    list: true
  at_uri:
    type: string
    label: AT URI
    default: ""
    readonly: true
    hidden: true
  redirect_from:
    type: string
    label: Original URL
    default: ""
    hidden: true
  external_url:
    type: object
    label: External URL
    fields:
      - name: path
        label: Link
        type: string
      - name: reaction
        label: Reaction
        type: select
        options:
          placeholder: Choose an IndieWeb-compatible reaction
          values:
            - name: reply
              label: Reply
            - name: like
              label: Like
            - name: repost
              label: Repost
  category:
    type: select
    label: Category
    options:
      values:
        - name: links
          label: Links
        - name: notas
          label: Notas
        - name: textos
          label: Textos
        - name: reviews
          label: Reviews
        - name: fotos
          label: Fotos

content:
  - name: posts
    label: Posts
    type: group
    items:
      - name: drafts
        label: Drafts
        type: collection
        path: _drafts
        fields:
          - name: layout
            component: layout
          - name: title
            component: title
          - name: body
            component: body
          - name: image
            component: image
          - name: category
            component: category
          - name: tags
            component: tags
          - name: review
            component: review
          - name: external_url
            component: external_url
          - name: canonical_url
            component: canonical_url
          - name: syndicate_to
            component: syndicate_to
          - name: syndication
            component: syndication
        view:
          fields:
            - title
            - category
            - tags
          primary: title
          sort:
            - title
          default:
            sort: title
            order: asc
        commit:
          templates:
            create: "draft: add {filename}"
            update: "draft: update {filename}"
            delete: "draft: remove {filename}"
            rename: "draft: rename {oldFilename} -> {newFilename}"
      - name: posts
        label: All Posts
        type: collection
        path: _posts
        fields:
          - name: layout
            component: layout
          - name: date
            component: date
          - name: title
            component: title
          - name: body
            component: body
          - name: image
            component: image
          - name: category
            component: category
          - name: tags
            component: tags
          - name: review
            component: review
          - name: external_url
            component: external_url
          - name: canonical_url
            component: canonical_url
          - name: syndicate_to
            component: syndicate_to
          - name: syndication
            component: syndication
          - name: at_uri
            component: at_uri
          - name: redirect_from
            component: redirect_from
        view:
          fields:
            - title
            - category
            - date
            - tags
          primary: title
          sort:
            - date
            - title
          default:
            sort: date
            order: desc
        commit:
          templates:
            create: "post: add {filename}"
            update: "post: update {filename}"
            delete: "post: remove {filename}"
            rename: "post: rename {oldFilename} -> {newFilename}"
  - name: pages
    label: Pages
    type: group
    items:
      - name: sobre
        label: Sobre
        type: file
        path: sobre.md
        fields:
          - name: layout
            component: layout
            default: page
          - name: title
            component: title
          - name: body
            type: code
            label: Body
            options:
              format: markdown
        commit:
          templates:
            update: "page(sobre): update {filename}"
      - name: arquivo
        label: Arquivo
        type: file
        path: arquivo.html
        fields:
          - name: layout
            component: layout
            default: page
          - name: title
            component: title
          - name: body
            type: code
            label: Body
            options:
              format: html
        commit:
          templates:
            update: "page(arquivo): update {filename}"
