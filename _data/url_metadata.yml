  title: "‎Every movie referenced/watched in Gilmore Girls (including quotes) !, a
    list of films by Laura Parker-Saladino • Letterboxd"
  charset: UTF-8
  viewport: width=1024
  description: 'A list of 462 films compiled on Letterboxd, including West Side Story
    (1961), Rosemary''s Baby (1968), Mommie Dearest (1981), The Hunchback of Notre
    Dame (1939) and Schindler''s List (1993). About this list: Buzzfeed once published
    a list of all the movies referenced in Gilmore Girls, which was great, but also
    not entirely correct. Because the person who made the list included movies that
    weren''t actually referenced because they misunderstood dialogue or assumed the
    reference made was about a movie when it was actually about a book or play of
    the same title. They also just left some out. I am here to rectify this. If the
    reference made could be about either a movie or some other art form of the same
    name (like To Kill a Mockingbird) and it isn''t clear which one they''re referencing,
    I included it. If the reference is clearly not about the movie, I didn''t include
    it. Films are listed in the order in which they are originally referenced.'
