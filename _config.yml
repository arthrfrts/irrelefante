title: Irrelefante
description: >-
  Nada faz muito sentido.
logo: /assets/logo.png

url: "https://irrelefante.com.br"
baseurl: ""
permalink: "/:slugified_categories/:year/:month/:day/:title/"

lang: pt-BR
timezone: America/Sao_Paulo
encoding: utf-8

defaults:
- scope:
    type: "posts"
  values:
    syndicate_to:
      - bluesky
      - mastodon

author:
  name: Arthur Freitas
  email: arthur@arthr.me
  uri: https://arthr.me

plugins:
  - jekyll-feed
  - jekyll-json-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-archives
  - jekyll-url-metadata
  - jekyll-webmention_io
  - jekyll-standard-site

include:
  - _redirects

# Plugin: jekyll-feed
feed:
  icon: "/assets/logo.png"
  categories:
    - textos
    - fotos
    - notas
    - links
    - reviews

# Plugin: jekyll-seo-tag
seo:
  name: Irrelefante
  links:
    - https://bsky.app/profile/irrelefante.com.br
    - https://organica.social/@arthr

# Plugin: jekyll-paginate
paginate: 25
paginate_path: /p/:num/

# Plugin: jekyll-archives
jekyll-archives:
  slug_mode: latin
  enabled:
    - year
    - categories
    - tags
  layout: archive
  permalinks:
    year: "/:year/"
    tag: "/tags/:name/"
    category: "/:name/"

# Plugin: jekyll-webmention_io
webmentions:
  username: arthr.me
  cache_folder: _data/webmentions
  syndication:
    bluesky:
      endpoint: https://brid.gy/publish/bluesky
      response_mapping:
        syndication: $.url
    mastodon:
      endpoint: https://brid.gy/publish/mastodon
      response_mapping:
        syndication: $.url
    flickr:
      endpoint: https://brid.gy/publish/flickr
      response_mapping:
        syndication: $.url
  templates:
    webmentions: _includes/webmentions.html
  legacy_domains:
    - https://arthrfrts.tumblr.com
    - https://arthr.me
  throttle_lookups:
    last_week: daily
    last_month: weekly
    last_year: every 2 weeks
    older: monthly
  cache_bad_uris_for: 5
  bad_uri_policy:
    default:
      policy: retry
      max_attempts: 5

# Plugin: jekyll-standard-site
standard_site:
  publication: "at://did:plc:5anqf5uonyp67nsex6h55l6p/site.standard.publication/3muwvtfv4m32m"
