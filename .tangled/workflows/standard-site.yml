when:
  - event: ["push", "manual"]

engine: "nixery"

dependencies:
  nixpkgs:
    - ruby
    - bundler
    - gcc
    - gnumake
    - git
    - openssh

environment:
  BUNDLE_PATH: "/tangled/workspace/.bundle"
  BSKY_PDS: "https://tngl.sh"
  BSKY_HANDLE: "arthr.me"
  BRANCH: "main"
  TANGLED_REMOTE: "git@tangled.org:did:plc:hphdefdmm7ddhhjq7coytopt/irrelefante"

steps:
  - name: "Installing gems"
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"
      bundle install

  - name: "Publishing PDS docs"
    command: bundle exec rake standard_site:publish

  - name: "Commits and pushes front-matter"
    command: |
      if [ -z "$(git status --porcelain _posts)" ]; then
        echo "Nothing to update."
        exit 0
      fi

      mkdir -p ~/.ssh
      printf '%s\n' "$TANGLED_SSH_KEY" > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keyscan tangled.org >> ~/.ssh/known_hosts 2>/dev/null

      cat > ~/.ssh/config <<EOF
      Host tangled.org
        Hostname tangled.org
        User git
        IdentityFile ~/.ssh/id_ed25519
        AddressFamily inet
      EOF

      git config user.name "spindle-bot"
      git config user.email "bot@irrelefante.com.br"
      git add _posts
      git commit -m "chore: adds at_uri to posts"
      git remote add tangled "$TANGLED_REMOTE" 2>/dev/null || git remote set-url tangled "$TANGLED_REMOTE"
      git push tangled "HEAD:${BRANCH}"
