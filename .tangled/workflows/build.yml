when:
  - event: ["push", "manual"]
    branch: ["main"]

engine: "nixery"

dependencies:
  nixpkgs:
    - ruby
    - bundler
    - gcc
    - gnumake
    - pkg-config
    - openssl
    - openssl.dev
    - git
    - curl
    - coreutils

environment:
  JEKYLL_ENV: "production"
  BUNDLE_PATH: "/tangled/workspace/.bundle"
  WISP_HANDLE: "arthr.me"
  SITE_NAME: "irrelefante"

steps:
  - name: "Installing gems"
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"
      
      OPENSSL_DEV=$(ls -d /nix/store/*-openssl-*-dev 2>/dev/null | head -1)
      OPENSSL_OUT=$(ls -d /nix/store/*-openssl-* 2>/dev/null | grep -vE -- '-(dev|bin|man|doc)$' | head -1)
      echo "DEV=$OPENSSL_DEV"
      echo "OUT=$OPENSSL_OUT"
      
      if [ ! -f "$OPENSSL_DEV/include/openssl/ssl.h" ]; then
        echo "ERROR: ssl.h not found in $OPENSSL_DEV/include/openssl/"
        ls -R "$OPENSSL_DEV" 2>/dev/null | head -50
        exit 1
      fi
      
      export BUNDLE_BUILD__OPENSSL="--with-openssl-include=${OPENSSL_DEV}/include --with-openssl-lib=${OPENSSL_OUT}/lib"
      
      bundle install

  - name: "Building Jekyll"
    command: bundle exec jekyll build

  - name: "Deploying to wisp.place"
    command: |
      curl -L https://sites.wisp.place/nekomimi.pet/wisp-cli-binaries/wisp-cli-x86_64-linux -o wisp-cli
      chmod +x wisp-cli
        ./wisp-cli "$WISP_HANDLE" \
        --path _site \
        --site "$SITE_NAME" \
        --password "$WISP_APP_PASSWORD"