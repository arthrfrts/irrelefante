name: standard.site publish

on:
  push:
    branches: [main]
    paths: ['_posts/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.1'
          bundler-cache: true

      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Publish documents to PDS
        env:
          BSKY_HANDLE: arthr.me
          BSKY_PDS: https://tngl.sh
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: bundle exec rake standard_site:publish

      - name: Commit at_uri back
        run: |
          [ -z "$(git status --porcelain _posts)" ] && { echo "Nothing new."; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts
          git commit -m "chore: add at_uri to posts"
          git push
