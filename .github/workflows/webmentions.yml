name: webmentions

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  webmention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.1'
          bundler-cache: true

      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Send & receive webmentions
        run: bundle exec jekyll webmention

      - name: Commit updated cache
        run: |
          [ -z "$(git status --porcelain .cache)" ] && { echo "No cache change."; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .cache
          git commit -m "chore: update webmention cache"
          git push
